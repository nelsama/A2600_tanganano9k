SYMBOLS { __STACKTOP__: type=weak, value=$1000; }
MEMORY {
  ZP:  start=$02, size=$80;
  RAM: start=$0200, size=$0A00;
  PRG: start=$D800, size=$27FA, fill=yes, file=%O;
  VEC: start=$FFFA, size=6, file=%O;
}
SEGMENTS {
  ZEROPAGE: load=ZP, type=zp;
  STARTUP:  load=PRG, type=ro;
  CODE:     load=PRG, type=ro;
  RODATA:   load=PRG, type=ro;
  ONCE:     load=PRG, type=ro, optional=yes;
  DATA:     load=PRG, run=RAM, type=rw, define=yes;
  BSS:      load=RAM, type=bss, define=yes;
  VECTORS:  load=VEC, type=ro;
}
